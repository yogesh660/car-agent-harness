name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: install
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: |
          if [ -f uv.lock ]; then uv sync --all-extras --locked; else uv sync --all-extras; fi
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: test
        run: uv run pytest --cov=car_agent --cov=evals --cov-report=term-missing
