+name: Rebuild combined website

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
    steps:
      - name: Request portfolio rebuild
        if: env.PORTFOLIO_DISPATCH_TOKEN != ''
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PORTFOLIO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yogesh660/yogesh660.github.io/actions/workflows/cloudflare-pages.yml/dispatches \
            --data '{"ref":"main","inputs":{"source":"car-agent-harness"}}'
      - name: Explain skipped rebuild
        if: env.PORTFOLIO_DISPATCH_TOKEN == ''
        run: echo "PORTFOLIO_DISPATCH_TOKEN is not configured; skipping combined-site rebuild."

